name: Build and release WordCraft API Edition
on:
  push:
    tags: ['v*-api.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v*-api.* tag to rebuild and publish; blank only builds'
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win64
            executable: wordcraft.exe
          # Intel runner avoids the constrained/deprecated macOS 14 arm64 pool.
          # Xcode links the unchanged aarch64 target using the macOS SDK.
          - os: macos-15-intel
            target: aarch64-apple-darwin
            platform: macos-arm64
            executable: wordcraft
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
      CRAFT_I18N_REQUIRED: '1'
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: aced4137c022f1f587624d48e81ec77e1914a9cc
          path: craft-fonts
      - name: Check packaging
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wordcraft
          key: wordcraft-${{ matrix.target }}
      - name: Build
        working-directory: wordcraft
        run: cargo build --locked --release -p wordcraft --target ${{ matrix.target }}
        env:
          WORDCRAFT_REQUIRE_WINRES: '1'
      - name: Package
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version=0.11.0-api.20261029.3
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$REQUESTED_TAG" ]]; then
            [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-api\.[0-9.]+$ ]] || { echo 'Invalid existing API release tag'; exit 1; }
            git show-ref --verify --quiet "refs/tags/$REQUESTED_TAG"
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "$REQUESTED_TAG^{commit}")" ]]
            version="${REQUESTED_TAG#v}"
          fi
          python scripts/package.py --platform '${{ matrix.platform }}' --binary 'wordcraft/target/${{ matrix.target }}/release/${{ matrix.executable }}' --version "$version" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: WordCraft-${{ matrix.platform }}
          path: dist/*
  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add project source and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=WordCraft-API-source/ HEAD --output "dist/WordCraft-${RELEASE_TAG#v}-source.zip"
          (cd dist && sha256sum *.zip > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish WordCraft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --latest --title "WordCraft API Edition · ${RELEASE_TAG#v}" --notes-file RELEASE-NOTES.md dist/*.zip dist/*.sha256 dist/SHA256SUMS.txt
